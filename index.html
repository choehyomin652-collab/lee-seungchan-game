<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>우리반 오토배틀</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 육각 칠판(보드)이 중심. 세로 화면은 위에서 아래로 쌓고, 태블릿 가로는 상점 위 / 시너지 왼쪽 / 플레이어 목록 오른쪽 */
:root {
  --board: #1d3a2f;
  --hex-mine: #23463a;
  --hex-foe: #1a3329;
  --board-line: #2f5545;
  --bg: #13241d;
  --panel: #1a2f26;
  --chalk: #eef2e6;
  --chalk-dim: #9fb3a6;
  --accent: #f5d76e;
  --danger: #ff8a7a;
  --c1: #c9d1cc; --c2: #7fe0b0; --c3: #7fc4ff; --c4: #e39cff; --c5: #ffcc4d;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--chalk);
  font-family: var(--body); font-size: 14px;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
.wrap {
  max-width: 560px; margin: 0 auto; box-sizing: border-box;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 8px 20px;
  display: flex; flex-direction: column; gap: 8px;
}
.hud { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hud .title { font-family: var(--display); font-size: 18px; color: var(--accent); }
.stage { font-family: var(--display); font-size: 18px; display: flex; gap: 6px; align-items: center; }
.rtype { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--panel); color: var(--chalk-dim); }
.rtype.pvp { color: var(--danger); } .rtype.pve { color: var(--c3); } .rtype.carousel { color: var(--accent); }
.stats { display: flex; gap: 10px; font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums; }
.stat-hp { color: var(--danger); } .stat-gold { color: var(--accent); }
.timer { height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; }
.timer > i { display: block; height: 100%; width: 100%; background: var(--accent); }
.players { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.pl {
  position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; gap: 4px;
  font-family: var(--display); font-size: 13px; padding: 4px 6px; border-radius: 6px;
  background: var(--panel); color: var(--chalk); border: 1.5px solid transparent; cursor: pointer; text-align: left;
}
.pl i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--c2); }
.pl.me { border-color: var(--accent); }
.pl.opp { border-color: var(--danger); }
.pl.scout { background: #2b4a3e; }
.pl.dead { opacity: .4; }
.pl .pn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pl .ph { font-variant-numeric: tabular-nums; }
.lvlrow { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--chalk-dim); }
.xpbar { flex: 1; min-width: 60px; height: 6px; background: var(--board-line); border-radius: 3px; overflow: hidden; }
.xpbar > i { display: block; height: 100%; background: var(--c3); width: 0; }
.traits { display: flex; flex-wrap: wrap; gap: 5px; min-height: 24px; }
.trait {
  font-size: 12px; padding: 3px 8px; border-radius: 12px; border: 1px dashed var(--chalk-dim);
  color: var(--chalk-dim); white-space: nowrap; background: none; font-family: var(--body);
}
.trait.on { border-style: solid; border-color: var(--accent); color: var(--bg); background: var(--accent); font-weight: 700; }
.trait.hint { border: none; padding-left: 0; }
#boardbox { min-width: 0; display: flex; justify-content: center; }
#cv { display: block; touch-action: none; }
.info {
  background: var(--panel); border-radius: 10px; padding: 9px 12px; min-height: 40px;
  display: flex; gap: 10px; align-items: center; font-size: 13px; line-height: 1.5;
}
.info .txt { flex: 1; min-width: 0; }
.info b { font-family: var(--display); font-weight: 400; font-size: 16px; }
.info .it { display: inline-block; padding: 0 5px; border-radius: 4px; color: #10201a; font-family: var(--display); font-size: 12px; }
.guide { color: var(--chalk-dim); font-size: 12px; }
.btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
button {
  font-family: var(--display); font-size: 15px; color: var(--chalk); background: var(--panel);
  border: 2px solid var(--board-line); border-radius: 10px; padding: 8px 4px; cursor: pointer;
}
button small { display: block; font-size: 12px; color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .4; }
button.go { background: var(--accent); color: var(--bg); border-color: var(--accent); }
button.go small { color: var(--bg); }
button.on { border-color: var(--accent); color: var(--accent); }
button.sell { color: var(--danger); border-color: var(--danger); padding: 6px 10px; white-space: nowrap; }
.shop { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.card {
  background: var(--chalk); color: #1c2a23; border-radius: 8px; padding: 4px 4px 5px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
  border: 2px solid var(--cc, var(--c1)); min-width: 0; position: relative; font-family: var(--body);
}
.card .face {
  position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 5px; display: grid; place-items: center;
  font-family: var(--display); font-size: 22px; color: #10201a; padding-top: 10px; box-sizing: border-box;
  background: linear-gradient(160deg, var(--cc, var(--c1)), color-mix(in srgb, var(--cc, var(--c1)) 45%, #1d3a2f));
}
.card .cost { position: absolute; top: 1px; left: 4px; font-style: normal; font-family: var(--display); font-size: 11px; }
.card .nm { font-family: var(--display); font-size: 14px; white-space: nowrap; }
.card .tr { font-size: 10px; line-height: 1.25; text-align: center; color: #44564c; }
.card.empty { background: transparent; border: 2px dashed var(--board-line); cursor: default; min-height: 90px; }
.card.own::after {
  content: "보유"; position: absolute; top: -5px; right: -3px; font-size: 10px;
  background: var(--accent); color: var(--bg); border-radius: 6px; padding: 0 4px; font-family: var(--display);
}
.card.two::after { content: "★ 2개"; background: var(--danger); }
.card.poor { opacity: .45; }
.odds { font-size: 11px; color: var(--chalk-dim); text-align: center; font-variant-numeric: tabular-nums; }
.toggles { display: flex; gap: 6px; justify-content: center; }
.toggles button { font-size: 13px; padding: 5px 12px; }
.toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 60px); transform: translateX(-50%);
  background: var(--chalk); color: var(--bg); font-family: var(--display); padding: 8px 14px; border-radius: 10px;
  font-size: 15px; z-index: 20; max-width: 86vw; text-align: center; pointer-events: none;
}
.overlay {
  position: fixed; inset: 0; background: rgba(10, 20, 15, .88); z-index: 30;
  display: flex; align-items: center; justify-content: center; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ov-box { background: var(--board); border: 3px solid var(--chalk-dim); border-radius: 14px; padding: 20px; max-width: 400px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 12px; margin-block: 16px; }
.ov-box h1 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; color: var(--accent); text-wrap: balance; }
.ov-box p { margin: 0; line-height: 1.6; }
.ov-box ul { text-align: left; margin: 0; padding-left: 18px; line-height: 1.6; font-size: 13px; color: var(--chalk-dim); }
@media (orientation: landscape) and (min-width: 700px) {
  .wrap {
    max-width: 1400px; display: grid; gap: 8px 14px;
    grid-template-columns: minmax(170px, 220px) minmax(0, 1fr) minmax(150px, 200px);
    grid-template-areas: "hud hud hud" "timer timer timer" "lvl shop btns" "odds odds odds" "traits board players" "info board toggles";
    grid-template-rows: auto auto auto auto auto 1fr;
  }
  .hud { grid-area: hud; } .timer { grid-area: timer; } .shop { grid-area: shop; } .odds { grid-area: odds; }
  .lvlrow { grid-area: lvl; flex-direction: column; align-items: stretch; justify-content: center; font-family: var(--display); font-size: 16px; color: var(--chalk); }
  .btns { grid-area: btns; grid-template-columns: 1fr 1fr; }
  .lvlrow .xpbar { flex: none; height: 8px; }
  .traits { grid-area: traits; flex-direction: column; flex-wrap: nowrap; align-items: stretch; }
  .trait { font-size: 14px; padding: 5px 10px; border-radius: 8px; text-align: left; }
  #boardbox { grid-area: board; align-items: flex-start; }
  .players { grid-area: players; grid-template-columns: 1fr; align-content: start; }
  .pl { font-size: 15px; padding: 7px 10px; }
  .info { grid-area: info; align-self: start; flex-direction: column; align-items: stretch; }
  .toggles { grid-area: toggles; align-self: start; flex-direction: column; }
  .card .face { aspect-ratio: 3 / 1; font-size: 24px; padding-top: 0; }
  .card .cost { font-size: 14px; }
  .card .nm { font-size: 16px; } .card .tr { font-size: 12px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="stage"><span id="stage">1-1</span><span class="rtype" id="rtype">급식 줄</span></div>
    <div class="title">우리반 오토배틀</div>
    <div class="stats"><span class="stat-hp" id="hp">♥ 100</span><span class="stat-gold" id="gold">● 0</span></div>
  </div>
  <div class="timer"><i id="timerfill"></i></div>
  <div class="players" id="players"></div>
  <div class="traits" id="traits"></div>
  <div id="boardbox"><canvas id="cv"></canvas></div>
  <div class="info" id="info"></div>
  <div class="lvlrow"><span id="lvl">레벨 1</span><div class="xpbar"><i id="xpfill"></i></div><span id="xptxt">0/2</span></div>
  <div class="btns">
    <button id="buyxp">경험치<small>● 4</small></button>

  <div class="odds" id="odds"></div>

</div>
<div class="overlay" id="ov">

    <h1 id="ovtitle">우리반 오토배틀</h1>
    <p id="ovtext">8개 반이 겨루는 오토배틀. 마지막까지 살아남으면 1등!</p>
    <ul id="ovrules">
      <li>매 라운드 상점에서 친구를 사서 육각 칠판에 배치해요</li>

      <li>같은 특성을 모으면 시너지 보너스</li>
      <li>몬스터 라운드에서 아이템 재료를 얻고, 재료 2개를 한 친구에게 주면 완성 아이템이 돼요</li>
      <li>급식 줄 라운드: 체력이 낮은 반부터 친구를 하나씩 골라요</li>
      <li>지면 체력이 깎여요. 체력이 0이 되면 탈락</li>
    </ul>
    <p id="best" style="font-size:13px;color:var(--chalk-dim)"></p>
    <button class="go" id="start">시작하기</button>
  </div>
</div>

  $("players").querySelectorAll(".pl").forEach((el) => (el.onclick = () => {
    const i = +el.dataset.i;
    if (S.phase !== "plan" || i === 0 || !S.players[i].alive) return toast(i === 0 ? "내 반이에요" : "계획 단계에서만 정찰할 수 있어요");
    S.scout = S.scout === i ? null : i; renderUI();
  }));
  // 시너지
  const cnt = traitCounts(unitsOf(P).filter((x) => x.w === "b").map((x) => x.u.d));
  const keys = Object.keys(cnt).sort((a, b) => traitLvl(b, cnt[b]) - traitLvl(a, cnt[a]) || cnt[b] - cnt[a]);
  $("traits").innerHTML = keys.length
    ? keys.map((k) => {
        const on = traitLvl(k, cnt[k]) > 0, th = TRAITS[k].t, next = th.find((x) => x > cnt[k]) ?? th.at(-1);
        return `<button class="trait${on ? " on" : ""}" data-t="${k}">${k} ${cnt[k]}/${next}</button>`;
      }).join("")
    : `<span class="trait hint">배치한 친구들의 시너지가 여기에 표시돼요</span>`;
  $("traits").querySelectorAll("[data-t]").forEach((el) => (el.onclick = () => {
    const t = el.dataset.t;
    $("info").innerHTML = `<div class="txt"><b>${t}</b> (${TRAITS[t].t.join(" / ")})<br>${TRAITS[t].d}<br><span class="guide">${DEFS.filter((d) => d.t.includes(t)).map((d) => d.n).join(", ")}</span></div>`;
  }));
  // 상점
  const ownCount = {};
  unitsOf(P).forEach((x) => { if (x.u.star === 1) ownCount[x.u.d] = (ownCount[x.u.d] || 0) + 1; else ownCount[x.u.d] = ownCount[x.u.d] || 0.5; });
  $("shop").innerHTML = (P.shop.length ? P.shop : [null, null, null, null, null]).map((di, i) => {
    if (di == null) return `<div class="card empty"></div>`;
    const d = DEFS[di], oc = ownCount[di];
    return `<div class="card${oc ? (oc >= 2 ? " own two" : " own") : ""}${P.gold < d.c ? " poor" : ""}" data-i="${i}" style="--cc:var(${COST_COLOR[d.c]})" role="button" tabindex="0">
      <div class="face"><i class="cost">● ${d.c}</i>${short(d.n)}</div><span class="nm">${d.n}</span><span class="tr">${d.k} · ${d.t.join(" · ")}</span></div>`;
  }).join("");
  $("shop").querySelectorAll(".card[data-i]").forEach((el) => {
    const go = () => humanBuy(+el.dataset.i);
    el.onclick = go;
    el.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  });
  $("odds").textContent = `레벨 ${P.level} 등장 확률  ` + ODDS[P.level].map((p, i) => `${i + 1}코 ${p}%`).join(" · ");
  const open = shopOpen();
  $("reroll").disabled = !open; $("buyxp").disabled = !open || P.level >= 10;
  $("lock").classList.toggle("on", P.locked); $("lock").querySelector("small").textContent = P.locked ? "잠김" : "잠금";
  $("ready").disabled = S.phase !== "plan";
  $("speed").textContent = `속도 ×${S.speed}`;
  $("mute").textContent = muted ? "소리 꺼짐" : "소리 켜짐";
  // 정보창
  if (S.sel) {
    if (S.sel.w === "i" && P.items[S.sel.i]) return showItem(P.items[S.sel.i]);
    const u = S.sel.w !== "i" ? getAt(P, S.sel) : null;
    if (u) return showUnit(u, false);
    S.sel = null;
  }
  let guide;
  if (S.phase === "carousel") guide = "급식 줄: 체력이 낮은 반부터 하나씩 골라요. 내 차례가 오면 돌아가는 친구를 탭하세요. 친구는 아이템을 들고 있어요.";
  else if (S.phase === "plan") {
    const act = keys.filter((k) => traitLvl(k, cnt[k]) > 0).map((k) => TRAITS[k].d);
    guide = act.length ? "적용 중: " + act.join(" · ") : S.type === "pve" ? "몬스터 라운드! 이기면 아이템 재료를 얻어요. 친구를 탭해서 고르고 놓을 칸을 탭하세요." : "다른 반 이름을 누르면 그 반 배치를 정찰할 수 있어요. 시간이 끝나면 자동으로 전투가 시작돼요.";
  } else guide = "전투 중… 친구를 탭하면 실시간 상태를 볼 수 있어요. 대기석 정리와 상점 구매는 지금도 할 수 있어요.";
  $("info").innerHTML = `<div class="txt guide">${guide}</div>`;
}
function humanBuy(i) {
  const P = human();
  if (!shopOpen()) return;
  const di = P.shop[i]; if (di == null) return;
  if (P.gold < DEFS[di].c) return toast("골드가 부족해요");
  if (!buy(P, i)) return toast(S.phase === "plan" ? "대기석이 가득 찼어요" : "대기석이 가득 찼어요 (합성은 전투 후에)");
  sfx("buy"); renderUI();
}
$("reroll").onclick = () => { const P = human(); if (!shopOpen()) return; if (!reroll(P)) return toast("골드가 부족해요"); sfx("buy"); renderUI(); };
$("buyxp").onclick = () => { const P = human(); if (!shopOpen()) return; if (!buyXp(P)) return toast("골드가 부족해요"); sfx("place"); renderUI(); };
$("lock").onclick = () => { const P = human(); P.locked = !P.locked; renderUI(); };
$("ready").onclick = () => startCombat();
$("speed").onclick = () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1; renderUI(); };
$("mute").onclick = () => { muted = !muted; try { localStorage.setItem("uri-mute", muted ? "1" : "0"); } catch (e) {} renderUI(); };
$("start").onclick = () => {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  $("ov").hidden = true; newGame(); resize();
};
try { const b = +localStorage.getItem("uri-best-place") || 0; if (b) $("best").textContent = `최고 기록: ${b}등`; } catch (e) {}
window.addEventListener("resize", () => { resize(); });
if (document.fonts) document.fonts.ready.then(() => { readTokens(); resize(); });
newGame();
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
