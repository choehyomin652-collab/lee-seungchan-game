# 홈 화면 앱(PWA) 주소: 기본 브랜치에 올라오면 GitHub Pages 로 게임을 배포해요
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 바꿔 주세요
name: 앱 배포 (GitHub Pages)
on:
  push:
    branches: [claude/game-development-7um8lj]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 게임 파일만 모으기
        run: |
          mkdir _site
          cp -r index.html style.css manifest.webmanifest sw.js js icons _site/
          # 배포할 때마다 앱 저장소 이름을 바꿔서, 홈 화면 앱이 새 버전을 받게 해요
          sed -i "s/const CACHE = \"ssipto-v1\";/const CACHE = \"ssipto-${GITHUB_SHA::8}\";/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
